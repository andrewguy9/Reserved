[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reserved"
version = "0.1.0"
description = "Single-machine best-effort resource reservation daemon for physical hardware"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7",
    "pytest>=7",
]

[project.scripts]
reserved = "reserved.daemon:main"
reserve = "reserved.bin.reserve:main"
reserve-status = "reserved.bin.reserve_status:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reserved*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["reserved"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"
